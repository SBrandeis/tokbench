[package]
name = "tokbench-hf-tokenizers-0-21"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tokbench engine: HuggingFace tokenizers 0.21.4, the last 0.21 release."

[dependencies]
tokbench-core.workspace = true

# The latest 0.21 release. Pinned, not floated. A benchmark number without an exact version is not a
# result, and a silent minor bump would silently move the baseline every other
# engine is compared against.
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }

# Not a second implementation of the engine's parallelism -- the opposite. `tokenizers`
# parallelises `encode_batch` over rayon's *current* pool, so sizing that pool is how its
# own threading is asked for n threads. Without it the only knob is the process-wide
# RAYON_NUM_THREADS, which cannot vary across a sweep in one process.
rayon = "1"
